services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - redis
    networks:
      - app-net

  app-blue:
    build: .
    profiles: ["blue"]
    environment:
      - REDIS_HOST=redis
      - DEPLOY_COLOR=blue
      - COMMIT_SHA=dev-blue
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

  app-green:
    build: .
    profiles: ["green"]
    environment:
      - REDIS_HOST=redis
      - DEPLOY_COLOR=green
      - COMMIT_SHA=dev-green
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  redis-data: